# Extends the default ruleset. Test fixtures use synthetic fake tokens (policy: synthetic data only), so tests/ is
# allowlisted. Plain [allowlist] syntax on purpose: CI pins gitleaks 8.21.2, which ignores the newer [[allowlists]] tables.
[extend]
useDefault = true

[allowlist]
description = "Synthetic fake tokens in test fixtures"
paths = ['''^tests/''']
